{% extends 'lab3_app/base.html' %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="product-item" style="text-align: center; padding: 40px;">
        <h2 style="margin-bottom: 20px;">Відновлення пароля</h2>
        <p style="color: var(--muted); margin-bottom: 30px; line-height: 1.6;">
            Забули пароль? Введіть свій email, і ми надішлемо вам посилання для його скидання.
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="color: var(--accent); font-size: 13px; margin-bottom: 8px; display: block;">Email адреса</label>
                {{ form.email }}
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%;">
                Надіслати лист
            </button>
        </form>
    </div>
</div>
{% endblock %}
