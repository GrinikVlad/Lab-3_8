{% extends 'lab3_app/base.html' %}
{% load socialaccount %} 

{% block content %}
<div class="auth-overlay">
    <div class="glass-card">
        <a href="{% url 'main' %}" style="position: absolute; top: 20px; right: 25px; color: white; text-decoration: none; font-size: 24px; opacity: 0.5;">✕</a>
        
        <h2 style="font-weight: 800; letter-spacing: 2px; color: white; margin-bottom: 40px;">LOGIN</h2>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div style="text-align: left; margin-bottom: 20px;">
                    <label style="color: var(--accent); font-size: 11px; text-transform: uppercase;">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                SIGN IN
            </button>
        </form>

        <div style="margin-top: 25px; display: flex; align-items: center; gap: 10px;">
            <div style="height: 1px; flex-grow: 1; background: var(--border);"></div>
            <span style="color: var(--muted); font-size: 12px; text-transform: uppercase;">або</span>
            <div style="height: 1px; flex-grow: 1; background: var(--border);"></div>
        </div>

        <div style="margin-top: 25px; display: flex; align-items: center; gap: 10px;">
    <div style="height: 1px; flex-grow: 1; background: var(--border);"></div>
    <span style="color: var(--muted); font-size: 12px; text-transform: uppercase;">або</span>
    <div style="height: 1px; flex-grow: 1; background: var(--border);"></div>
</div>

<form action="{% provider_login_url 'google' %}" method="post" style="margin: 0; padding: 0;">
    {% csrf_token %}
    <button type="submit" style="display: flex; align-items: center; justify-content: center; gap: 10px; background: white; color: #000; padding: 14px; border-radius: 12px; border: none; font-weight: 800; margin-top: 20px; transition: 0.3s; width: 100%; cursor: pointer; font-family: inherit; font-size: 15px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="width: 20px; height: 20px;">
        Увійти через Google
    </button>
</form>
        <p style="margin-top: 30px; font-size: 14px; color: rgba(255,255,255,0.7);">
            New here? <a href="{% url 'register' %}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
