{% extends 'lab3_app/base.html' %}

{% block content %}
    <h1 style="color: #00d1ff;">Асортимент дисків</h1>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        {% for rim in rims %}
            <div style="background: #2a2a2a; padding: 20px; border-radius: 10px; width: 250px; border: 1px solid #333;">
                <h2>{{ rim.brand.name }} {{ rim.name }}</h2>
                <p>Категорія: {{ rim.category.name }}</p>
                <p>Діаметр: R{{ rim.diameter }}</p>
                <h3 style="color: #00d1ff;">{{ rim.price }} грн</h3>
            </div>
        {% endfor %}
    </div>
{% endblock %}
