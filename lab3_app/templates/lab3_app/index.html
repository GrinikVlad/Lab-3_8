{% extends 'lab3_app/base.html' %}
{% block content %}
    <h1 class="glow-text">Асортимент дисків</h1>
    <div class="product-grid">
        {% for rim in rims %}
            <div class="product-card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <!-- Клікабельне фото -->
                    <a href="{% url 'rim_detail' rim.id %}">
                        {% if rim.photo %}
                            <img src="{{ rim.photo.url }}" class="product-img">
                        {% else %}
                            <div class="product-img" style="background: #333; display: flex; align-items: center; justify-content: center;">Немає фото</div>
                        {% endif %}
                    </a>

                    <!-- Клікабельна назва -->
                    <h2 style="font-size: 22px; margin: 15px 0 10px 0;">
                        <a href="{% url 'rim_detail' rim.id %}" style="color: #00ffcc; text-decoration: none; transition: 0.3s;">
                            {{ rim.brand.name }} {{ rim.name }}
                        </a>
                    </h2>

                    <p style="margin: 5px 0; color: #aaa;">R{{ rim.diameter }} | {{ rim.category.name }}</p>
                    <h3 class="price">{{ rim.price }} грн</h3>
                </div>

                <!-- Кнопка кошика -->
                <a href="{% url 'add_to_cart' rim.id %}" class="btn-primary" style="text-align: center; margin-top: 15px; padding: 10px; text-decoration: none;">
                    🛒 В кошик
                </a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
