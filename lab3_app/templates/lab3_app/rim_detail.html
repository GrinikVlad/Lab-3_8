{% extends 'lab3_app/base.html' %}
{% block content %}
    <div style="display: flex; gap: 40px; margin-top: 20px;">
        <div style="flex: 1;">
            {% if rim.photo %}
                <img src="{{ rim.photo.url }}" style="width: 100%; max-width: 500px; border-radius: 15px; border: 2px solid #00d1ff;">
            {% else %}
                <div style="width: 100%; height: 300px; background: #333; display: flex; align-items: center; justify-content: center;">Фото відсутнє</div>
            {% endif %}
        </div>
        <div style="flex: 1;">
            <h1 style="color: #00d1ff;">{{ rim.brand.name }} {{ rim.name }}</h1>
            <hr style="border: 0.5px solid #333;">
            <p style="font-size: 20px;">Категорія: <b>{{ rim.category.name }}</b></p>
            <p style="font-size: 20px;">Діаметр: <b>R{{ rim.diameter }}</b></p>
            <h2 style="color: #00d1ff; font-size: 32px;">Ціна: {{ rim.price }} грн</h2>

            <button style="background: #555; color: #aaa; padding: 15px 30px; border: none; border-radius: 5px; cursor: not-allowed; font-size: 18px;">
                Купити (Немає в наявності)
            </button>
            <br><br>
            <a href="{% url 'main' %}" style="color: #00d1ff;">⬅ Назад до списку</a>
        </div>
    </div>
{% endblock %}
