{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RimStore — Performance Wheels</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <a href="{% url 'main' %}" class="logo">RIM<span>STORE</span></a>
    <nav>
        <div class="category-menu">
            <a href="{% url 'main' %}" class="nav-link">Усі товари</a>
            {% for cat in categories %}
                <a href="{% url 'category_detail' cat.id %}" class="nav-link">{{ cat.name }}</a>
            {% endfor %}
        </div>
        <a href="{% url 'cart_page' %}" class="nav-link">🛒 Кошик</a>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}" class="nav-link profile-link">👤 {{ user.username }}</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}<button type="submit" class="logout-btn">Вийти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="nav-link">Увійти</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

</body>
</html>
